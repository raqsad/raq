name: RaqMusic Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 1) file desain RaqMusic (repo ini)
      - uses: actions/checkout@v4
        with:
          path: overlay
      # 2) source Metrolist asli (public), versi yang sama dengan yang dipakai saat membuat desain
      - uses: actions/checkout@v4
        with:
          repository: MetrolistGroup/Metrolist
          ref: e6fea3b36c68841bad21daa6252e1d69ecd3afbe
          path: src
      # 3) timpa dengan file RaqMusic
      - name: Apply RaqMusic files
        run: |
          if [ -d overlay/upload-app/app ]; then
            cp -r overlay/upload-app/app/. src/app/
          else
            cp -r overlay/app/. src/app/
          fi
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleFossDebug -x lint --warning-mode summary
        env:
          PULL_REQUEST: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: RaqMusic-debug-apk
          path: src/app/build/outputs/apk/foss/debug/*.apk
